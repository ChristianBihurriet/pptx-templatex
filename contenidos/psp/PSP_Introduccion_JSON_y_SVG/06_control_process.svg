<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#101827"/><stop offset="1" stop-color="#192842"/></linearGradient>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#76c6f6"/></marker></defs>
<rect width="1280" height="720" fill="url(#bg)"/>
<text x="70" y="76" fill="#f3f7ff" font-family="Arial,sans-serif" font-size="38" font-weight="bold">Controlar el proceso hijo</text>
<text x="70" y="113" fill="#a7b7d0" font-family="Arial,sans-serif" font-size="20">start(), pid(), isAlive(), waitFor() y exitValue().</text>
<rect x="60" y="250" width="240" height="135" rx="19" fill="#202f48" stroke="#76c6f6" stroke-width="2"/><text x="180.0" y="296" fill="#f4f8ff" font-family="Arial" font-size="27" font-weight="bold" text-anchor="middle">start()</text><text x="180.0" y="331" fill="#a9bad1" font-family="Arial" font-size="19" text-anchor="middle">Crea el hijo</text><path d="M305 318 L375 318" fill="none" stroke="#76c6f6" stroke-width="4" marker-end="url(#arrow)"/><rect x="385" y="250" width="240" height="135" rx="19" fill="#202f48" stroke="#76c6f6" stroke-width="2"/><text x="505.0" y="296" fill="#f4f8ff" font-family="Arial" font-size="27" font-weight="bold" text-anchor="middle">pid()</text><text x="505.0" y="331" fill="#a9bad1" font-family="Arial" font-size="19" text-anchor="middle">Obtiene el PID</text><path d="M630 318 L700 318" fill="none" stroke="#76c6f6" stroke-width="4" marker-end="url(#arrow)"/><rect x="710" y="250" width="240" height="135" rx="19" fill="#202f48" stroke="#76c6f6" stroke-width="2"/><text x="830.0" y="296" fill="#f4f8ff" font-family="Arial" font-size="27" font-weight="bold" text-anchor="middle">isAlive()</text><text x="830.0" y="331" fill="#a9bad1" font-family="Arial" font-size="19" text-anchor="middle">¿Sigue activo?</text><path d="M955 318 L1025 318" fill="none" stroke="#76c6f6" stroke-width="4" marker-end="url(#arrow)"/><rect x="1035" y="250" width="200" height="135" rx="19" fill="#202f48" stroke="#49d8ba" stroke-width="2"/><text x="1135.0" y="296" fill="#f4f8ff" font-family="Arial" font-size="27" font-weight="bold" text-anchor="middle">waitFor()</text><text x="1135.0" y="331" fill="#a9bad1" font-family="Arial" font-size="19" text-anchor="middle">Espera fin</text><text x="640" y="485" fill="#d9e6f8" font-family="Arial" font-size="25" text-anchor="middle">Tras terminar: exitValue() devuelve el código de salida</text><text x="640" y="544" fill="#d9e6f8" font-family="Arial" font-size="22" text-anchor="middle">0 suele indicar éxito · waitFor() bloquea el hilo llamante</text>
<text x="70" y="679" fill="#7286a4" font-family="Arial,sans-serif" font-size="16">PSP · 2.º DAM · Diagrama para insertar en PowerPoint</text></svg>